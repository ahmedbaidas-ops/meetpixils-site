<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeetPixils Ops</title><meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>:root{--plum:#0F010A;--panel:#2F263B;--cream:#FFFEEC;--orange:#EF5229;--o2:#FF7A4F;--lilac:#CCA4FD;--cyan:#2EBEEF;--green:#5FD39A}
*{box-sizing:border-box}
body{margin:0;background:var(--plum);color:var(--cream);font-family:Poppins,system-ui,sans-serif;font-size:15.5px;line-height:1.6;min-height:100vh}
[dir=rtl] body,body[dir=rtl]{font-family:Cairo,Poppins,sans-serif}
.mono{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase}
.wrap{max-width:920px;margin:0 auto;padding:0 clamp(18px,5vw,44px)}
header.top{display:flex;align-items:center;gap:14px;padding:20px 0}
header.top .spacer{margin-inline-start:auto}
.cut8{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.cut12{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.cut16{clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:var(--plum);border:0;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;letter-spacing:.02em;padding:15px 26px;cursor:pointer;text-decoration:none;transition:transform .2s cubic-bezier(.16,1,.3,1),background .2s}
.btn:hover{transform:translateY(-2px);background:var(--o2)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(255,254,236,.32)}
.btn.ghost:hover{background:rgba(255,254,236,.08)}
.pill{display:inline-block;background:var(--orange);color:var(--plum);font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 12px}
h1{font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:14px 0;text-wrap:balance}
[dir=rtl] h1{letter-spacing:0;line-height:1.32}
.dek{max-width:52ch;font-size:clamp(15px,1.8vw,17px);color:rgba(255,254,236,.72)}
.card{background:rgba(255,254,236,.035);border:1px solid rgba(255,254,236,.16);padding:24px 26px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.6}
.field input,.field select,.field textarea{font-family:inherit;font-size:15px;padding:13px 14px;min-height:48px;background:rgba(255,254,236,.06);color:var(--cream);border:1px solid rgba(255,254,236,.26);border-radius:0;outline:0;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(46,190,239,.22)}
.err{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--o2)}
.ok{color:var(--green)}
.deco{position:fixed;inset-inline-end:-40px;top:80px;width:260px;height:300px;pointer-events:none;opacity:.5;z-index:0}
.deco i{position:absolute;background:var(--orange);animation:pop .6s cubic-bezier(.16,1,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.6)}to{opacity:var(--o,1);transform:none}}
.strip{height:6px;background:repeating-linear-gradient(90deg,var(--orange) 0 16px,transparent 16px 40px);opacity:.4;margin-top:60px}
main{position:relative;z-index:1}
footer{padding:40px 0 30px;font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.45}
@media(prefers-reduced-motion:reduce){.deco i,.btn{animation:none;transition:none}}
@media(max-width:720px){.deco{display:none}}

table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:start;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;opacity:.5;padding:8px 10px 8px 0;border-bottom:2px solid var(--cream)}
td{padding:9px 10px 9px 0;border-bottom:1px solid rgba(255,254,236,.12);vertical-align:middle}
select.st{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px;background:rgba(255,254,236,.06);color:var(--cream);border:1px solid rgba(255,254,236,.26)}
.mini{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 12px;background:rgba(255,254,236,.07);color:var(--cream);border:1px solid rgba(255,254,236,.26);cursor:pointer}
.chip{cursor:pointer}
.chip[aria-pressed=true]{background:rgba(255,254,236,.18)}
</style></head><body>
<main class="wrap" style="max-width:1100px">
<header class="top"><span class="mono" style="color:var(--orange)">MEETPIXILS · OPS</span>
<span class="spacer"></span><span id="who" class="mono" style="opacity:.6"></span>
<button id="out" class="mini" hidden>Sign out</button></header>

<section id="gate" class="card cut16" style="max-width:380px;margin:60px auto">
  <p style="font-weight:800;font-size:20px;margin:0 0 14px">Sign in</p>
  <div class="field"><span>PASSWORD</span><input id="pw" type="password" autocomplete="current-password"></div>
  <button id="go" class="btn cut8">Sign in</button>
  <p id="gateMsg" class="err" style="margin:10px 0 0"></p>
</section>

<section id="panel" hidden>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
    <button class="mini chip" data-k="all" aria-pressed="true">all</button>
    <button class="mini chip" data-k="ticket">tickets</button>
    <button class="mini chip" data-k="battle-reg">battle</button>
    <button class="mini chip" data-k="donation">donations</button>
    <button class="mini chip" data-k="other">other</button>
    <input id="q" placeholder="search name / email / order" style="min-width:200px;font-size:13px;padding:8px;background:rgba(255,254,236,.06);color:var(--cream);border:1px solid rgba(255,254,236,.26)">
    <button id="refresh" class="mini">↻ refresh</button>
    <button id="csv" class="mini">⤓ CSV</button>
    <button id="backup" class="mini" title="super only">⤓ full backup</button>
    <span id="count" class="mono" style="opacity:.5"></span>
  </div>
  <div style="overflow-x:auto"><table><thead><tr>
    <th>KIND</th><th>WHO</th><th>DETAIL</th><th>PROOF</th><th>STATUS</th><th>WHEN</th>
  </tr></thead><tbody id="rows"></tbody></table></div>
  <p id="pMsg" class="err" style="margin:10px 0 0"></p>
</section>
</main>
<script>
var PW='',ROLE='',ROWS=[],KIND='all',STS=['receipt-review','loyalty-review','approved-pay-now','paid','rejected'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){fetch('/api/entries.php',{headers:{'X-MP-Pass':PW},cache:'no-store'})
 .then(function(r){if(!r.ok)throw r.status;return r.json()})
 .then(function(j){ROWS=j.entries||[];render()})
 .catch(function(e){document.getElementById('pMsg').textContent='load failed ('+e+')'});}
function shown(){var q=document.getElementById('q').value.toLowerCase();
 return ROWS.filter(function(r){
  var k=r._kind||'';
  if(KIND!=='all'&&(KIND==='other'?['ticket','battle-reg','donation'].indexOf(k)>-1:k!==KIND))return false;
  return !q||((r.name||'')+' '+(r.email||'')+' '+(r.order||'')).toLowerCase().indexOf(q)>-1;});}
function render(){var tb=document.getElementById('rows');tb.innerHTML='';
 var list=shown();document.getElementById('count').textContent=list.length+'/'+ROWS.length;
 list.slice().reverse().forEach(function(r){
  var tr=document.createElement('tr');
  var det=r.pass?esc(r.pass)+' · '+esc(r.price)+(r.loyalty&&r.loyalty!=='no'?' · loyalty':'')
    :r.amount?esc(r.initiative||'')+' · '+esc(r.amount)
    :r.team?esc(r.discipline||'')+' · '+esc(r.level||'')+' · '+esc(r.team)+(r.team_name?' ('+esc(r.team_name)+')':'')
    :r.total?esc(r.judge||'')+' scored '+esc(r.team||'')+' — '+esc(r.total)+'/100':'';
  var proof='';
  if(r.receipt)proof+='<button class="mini" data-f="'+esc(r.receipt)+'">receipt</button> ';
  if(r.stamp)proof+='<button class="mini" data-f="'+esc(r.stamp)+'">stamp</button>';
  var st='';
  if(r.order&&r.status){st='<select class="st" data-o="'+esc(r.order)+'">'+
   STS.map(function(x){return '<option'+(x===r.status?' selected':'')+'>'+x+'</option>'}).join('')+
   (STS.indexOf(r.status)<0?'<option selected>'+esc(r.status)+'</option>':'')+'</select>';}
  tr.innerHTML='<td class="mono" style="color:var(--orange)">'+esc(r._kind)+'</td>'+
   '<td>'+esc(r.name||'—')+'<br><span style="opacity:.55;font-size:11.5px">'+esc(r.email||'')+'</span></td>'+
   '<td>'+det+(r.portfolio?'<br><a href="'+esc(r.portfolio)+'" target="_blank" rel="noopener" style="color:var(--cyan);font-size:11.5px">'+esc(r.portfolio)+'</a>':'')+'</td>'+
   '<td>'+proof+'</td><td>'+st+(r.order?'<div class="mono" style="opacity:.45;font-size:9.5px" dir="ltr">'+esc(r.order)+'</div>':'')+'</td>'+
   '<td class="mono" style="opacity:.5">'+esc(((r._ts||r._at)||'').slice(0,16).replace('T',' '))+'</td>';
  tb.appendChild(tr);});
 tb.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){
  fetch('/api/receipt.php?f='+encodeURIComponent(b.dataset.f),{headers:{'X-MP-Pass':PW}})
  .then(function(r){if(!r.ok)throw 0;return r.blob()})
  .then(function(bl){window.open(URL.createObjectURL(bl),'_blank','noopener')})
  .catch(function(){document.getElementById('pMsg').textContent='image failed'});};});
 tb.querySelectorAll('select.st').forEach(function(s){s.onchange=function(){
  fetch('/api/entries.php',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({_action:'set-status',password:PW,order:s.dataset.o,status:s.value})})
  .then(function(r){if(!r.ok)throw r.status;
   var e=ROWS.filter(function(x){return x.order===s.dataset.o})[0];if(e)e.status=s.value;})
  .catch(function(e){document.getElementById('pMsg').textContent='status failed ('+e+') — moderator/super only'});};});}
document.getElementById('go').onclick=function(){
 var pw=document.getElementById('pw').value;
 fetch('/api/whoami.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})})
 .then(function(r){if(!r.ok)throw 0;return r.json()})
 .then(function(j){PW=pw;ROLE=j.role;try{sessionStorage.setItem('mp-ops',pw)}catch(e){}
  document.getElementById('gate').hidden=true;document.getElementById('panel').hidden=false;
  document.getElementById('who').textContent=ROLE.toUpperCase();document.getElementById('out').hidden=false;load();})
 .catch(function(){document.getElementById('gateMsg').textContent='✗ Wrong password'});};
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('go').click()});
document.getElementById('out').onclick=function(){try{sessionStorage.removeItem('mp-ops')}catch(e){};location.reload()};
document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){
 KIND=c.dataset.k;document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x===c)});render();};});
document.getElementById('q').oninput=render;
document.getElementById('refresh').onclick=load;
document.getElementById('csv').onclick=function(){
 var cols=['_kind','order','status','name','email','phone','pass','price','loyalty','discipline','level','portfolio','team','team_name','amount','initiative','judge','total','_ts','_at'];
 var csvEsc=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
 var csv=[cols.join(',')].concat(shown().map(function(r){return cols.map(function(c){return csvEsc(r[c])}).join(',')})).join('\n');
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));
 a.download='meetpixils-'+new Date().toISOString().slice(0,10)+'.csv';a.click();};
document.getElementById('backup').onclick=function(){
 fetch('/api/export.php',{headers:{'X-MP-Pass':PW}})
 .then(function(r){if(!r.ok)throw r.status;return r.blob()})
 .then(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='meetpixils-backup.zip';a.click();})
 .catch(function(e){document.getElementById('pMsg').textContent='backup failed ('+e+') — super only'});};
(function(){try{var s=sessionStorage.getItem('mp-ops');if(s){document.getElementById('pw').value=s;document.getElementById('go').click();}}catch(e){}})();
</script></body></html>
